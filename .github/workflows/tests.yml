# The regression wall's host layers on every push (ticket 43's CI half):
# the 16 offscreen JS suites, qmllint's fatal class, the packaging
# file-set gate, provenance, and the daemon's tests under clippy. The
# live lab layers (canary, restart-settle, QMP clicks) stay local —
# they need the disposable VM.
name: tests
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

jobs:
  wall-host:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git qt6-declarative qt6-tools
             xkbcommon cargo python coreutils grep
      - uses: actions/checkout@v4
      - name: Host battery (16 suites + qml gates)
        run: ./tools/run-tests.sh
      - name: Provenance gate
        run: ./tools/provenance.py
      - name: Clippy
        run: cargo clippy --manifest-path daemon/Cargo.toml
              --all-targets -- -D warnings
