# The regression wall's host layers on every push (ticket 43's CI half):
# the 21 offscreen JS suites, qmllint's fatal class, the packaging
# file-set gate, and the daemon's tests under clippy. The
# live lab layers (canary, restart-settle, QMP clicks) stay local —
# they need the disposable VM.
name: tests
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wall-host:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # Arch package names, verified the hard way (the first public run
      # died on a nonexistent 'xkbcommon'): libxkbcommon is the lib,
      # cargo rides the rust package. quickshell (extra) is what makes the
      # QML handler check real in CI — without its types the check skipped
      # itself (round seven's finding).
      - run: pacman -Syu --noconfirm git qt6-declarative qt6-tools
             libxkbcommon rust python coreutils grep ttf-jetbrains-mono-nerd
             quickshell
      # Pinned by commit (the audit's supply-chain nit): v4.2.2.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Host battery (16 suites + qml gates)
        run: ./tools/run-tests.sh
      - name: Clippy
        run: cargo clippy --manifest-path daemon/Cargo.toml
              --all-targets -- -D warnings
