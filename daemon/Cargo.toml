[package]
name = "omarchy-osk-daemon"
version = "0.1.0"
edition = "2021"
description = "Persistent Wayland virtual keyboard driven over a unix socket"
license = "MIT"

[dependencies]
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
